############################
# --- Website Settings --- #
############################

url: https://www.noakim.io
title: Noa Kim
author: Noa Kim
tagline: Full-stack Engineer
description: Noa Kim is a full-stack software engineer specializing in Rails, React, and mobile development.
email: hello@noakim.io
social:
  name: Noa Kim
  links:
    - https://www.github.com/noanonoa
    - https://www.linkedin.com/in/noanonoa

# Assets
logo: /assets/images/NK-square-logo.png
avatar: /assets/images/profile.jpg
title-image: /assets/images/NK-logo.png

include:
  - _pages

sass:
  style: compressed

# Projects
collections:
  projects:
    output: true
    permalink: /:collection/:name

###################
# --- Options --- #
###################

markdown: kramdown
permalink: /:title
timezone: America/Chicago
highlighter: rouge
github: [metadata]
repository: noanonoa/noanonoa.github.io
kramdown:
  input: GFM
defaults:
  - scope:
      path: "_pages"
    values:
      permalink: /:basename
  - scope:
      path: ""
      type: "posts"
    values:
      permalink: /blog/:title
  - scope:
      path: ""
    values:
      image:
        path: /assets/images/NK-landscape-og.png # OG image path

plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-email-protect
  - jekyll-seo-tag
  - jekyll-redirect-from

exclude:
  - node_modules/
  - vendor/
  - .bundle/
  - .jekyll-cache/
  - Gemfile
  - Gemfile.lock
  - package.json
  - yarn.lock
  - mise.toml
  - README.md
  - LICENSE
  - ANTIGRAVITY.md
