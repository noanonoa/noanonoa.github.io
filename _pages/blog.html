---
layout: default
---

<article class="s-blog">
  <header>
    <h1 class="accent">
      Blog
    </h1>
  </header>

  <ul>
    {% for post in site.posts %}
      <li>
        <h2><a href="{{ post.url }}">{{ post.title }}</a></h2>
        {{ post.excerpt }}
      </li>
    {% endfor %}
  </ul>
</article>
